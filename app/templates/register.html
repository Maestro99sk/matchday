{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:32px auto">
  <h2>Create account</h2>
  {% if ref %}<div class="flash ok">You were invited — your mate gets a budget boost when you join.</div>{% endif %}
  <form method="post" action="{{ url_for('register', ref=ref) if ref else url_for('register') }}">
    <label>Username (friends add you by this)</label><input type="text" name="username" autocomplete="username" required>
    <label>Password</label><input type="password" name="password" autocomplete="new-password" required>
    <button class="btn primary block mt" type="submit">Create account</button>
  </form>
  <p class="muted center mt">Already have one? <a href="{{ url_for('login') }}" style="color:var(--accent)">Log in</a></p>
</div>
{% endblock %}
