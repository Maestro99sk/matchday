{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:32px auto">
  <h2>Log in</h2>
  <form method="post">
    <label>Username</label><input type="text" name="username" autocomplete="username" required>
    <label>Password</label><input type="password" name="password" autocomplete="current-password" required>
    <button class="btn primary block mt" type="submit">Log in</button>
  </form>
  <p class="muted center mt">No account? <a href="{{ url_for('register') }}" style="color:var(--accent)">Create one</a></p>
</div>
{% endblock %}
